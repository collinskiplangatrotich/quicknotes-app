<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>

  <header>
    <h1>QuickNotes</h1>
    <p class="tagline">Your lightweight daily note-taking application</p>
  </header>

  <main>
    <!-- Task 1: Add Note Section -->
    <section id="add-note-section">
      <h2>Add a Note</h2>
      <form id="note-form">
        <div class="form-group">
          <label for="note-input">Note Text</label>
          <input 
            type="text" 
            id="note-input" 
            placeholder="Type your note here (max 200 chars)..." 
            autocomplete="off"
          />
        </div>

        <div class="form-group">
          <label for="note-category">Category</label>
          <select id="note-category">
            <option value="personal">Personal</option>
            <option value="work">Work</option>
            <option value="study">Study</option>
          </select>
        </div>

        <button type="submit" id="submit-btn">Add Note</button>
      </form>
      <p id="error-message"></p>
    </section>

    <!-- Task 1: Your Notes Section -->
    <section id="your-notes-section">
      <div class="section-header">
        <h2>Your Notes</h2>
        <button type="button" id="clear-all-btn" class="btn-clear-all">Clear All</button>
      </div>

      <div class="search-container">
        <input 
          type="search" 
          id="search-input" 
          placeholder="Search notes by keyword..." 
        />
      </div>

      <p id="note-count">You have no notes yet.</p>

      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes App. Built for Web Foundations.</p>
  </footer>

</body>
</html>
